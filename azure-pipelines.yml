trigger:
  branches:
    include:
      - main
      - flight-branch
      - bmw
    exclude:
      - features
      - credit-card

pr:
  branches:
    include:
      - bikes

#schedules:
#  - cron: "*/10 * * * *"
#   displayName: "run for every 10 minutes"
#    branches:
#      include:
#        - bikes

variables:
  solution: '**/*.slnx'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
stages:
  - stage: Build
    displayName: Build stage
    jobs: 
      - job: build
        displayName: Build job
        pool:
          vmImage: 'windows-latest'
        steps:
          - task: NuGetToolInstaller@1

          - task: NuGetCommand@2
            inputs:
              restoreSolution: '$(solution)'

          - task: VSBuild@1
            inputs:
              solution: '$(solution)'
              msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
              platform: '$(buildPlatform)'
              configuration: '$(buildConfiguration)'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'  
  - stage: Development
    displayName: Development
    dependsOn: Build
    jobs:
      - deployment: 
        displayName: deploy to Development
        environment: qwertyuio
        pool:
          vmImage: 'windows-latest'
        strategy:
          runOnce:
           deploy:
            steps:
              - download: current
                artifact: drop
              - task: AzureRmWebAppDeployment@5
                inputs:
                    ConnectionType: 'AzureRM'
                    azureSubscription: 'cloud sc'
                    appType: 'webApp'
                    WebAppName: 'Development'
                    packageForLinux: '$(pipeline.workspace)/drop/**/*.zip'
  - stage: QualityAssurance
    displayName: Quality Assurence
    dependsOn: Development
    jobs:
      - deployment: 
        displayName: deploy to Quality assurance
        environment: asdfghj
        pool:
          vmImage: 'windows-latest'
        strategy:
          runOnce:
           deploy:
            steps:
              - download: current
                artifact: drop
              - task: AzureRmWebAppDeployment@5
                inputs:
                    ConnectionType: 'AzureRM'
                    azureSubscription: 'cloud sc'
                    appType: 'webApp'
                    WebAppName: 'QualityAssurance'
                    packageForLinux: '$(pipeline.workspace)/drop/**/*.zip'

  - stage: Production
    displayName: production stage
    dependsOn: QualityAssurance
    jobs:
      - deployment: 
        displayName: deploy to production
        environment: Prod
        pool:
          vmImage: 'windows-latest'
        strategy:
          runOnce:
           deploy:
            steps:
              - script: sleep 60
                displayName: waiting in sleeping period for deploying
              - download: current
                artifact: drop
              - task: AzureRmWebAppDeployment@5
                inputs:
                  ConnectionType: 'AzureRM'
                  azureSubscription: 'cloud sc'
                  appType: 'webApp'
                  WebAppName: 'Production'
                  packageForLinux: '$(pipeline.workspace)/drop/**/*.zip'